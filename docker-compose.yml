services:
  web:
    build: .
    ports:
      - "3006:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=zolten
      - DB_PASSWORD=zolten_ranch_2024
      - DB_NAME=zolten_ranch
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./public:/app/public
    networks:
      - ranch_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=zolten
      - POSTGRES_PASSWORD=zolten_ranch_2024
      - POSTGRES_DB=zolten_ranch
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5434:5432"
    networks:
      - ranch_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zolten -d zolten_ranch"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/app/public:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - ranch_network

volumes:
  postgres_data:

networks:
  ranch_network:
    driver: bridge
